<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="KIR - Sistem Kelola Inventaris dan Pemeliharaan Peralatan">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KIR">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Kartu Inventarisasi Barang</title>

  <style>
    :root {
      --bg:#0f172a; --panel:#111c33; --text:#f8fafc; --muted:#94a3b8;
      --accent:#2563eb; --accent2:#38bdf8;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; background:var(--bg); overflow:hidden; }
    body { font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); }
    #splash {
      position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center;
      background:radial-gradient(circle at 50% 25%, #1e3a8a 0%, #0f172a 48%, #020617 100%);
      transition:opacity .45s ease, visibility .45s ease;
    }
    #splash.hide { opacity:0; visibility:hidden; pointer-events:none; }
    .splash-card { text-align:center; width:min(90vw,360px); }
    .logo {
      width:92px;height:92px;margin:0 auto 20px;border-radius:24px;
      box-shadow:0 18px 50px rgba(0,0,0,.35); animation:float 2s ease-in-out infinite;
    }
    .brand { font-size:30px;font-weight:800;letter-spacing:-.5px; }
    .subtitle { margin-top:7px;color:var(--muted);font-size:14px; }
    .loader { width:180px;height:4px;background:#1e293b;border-radius:20px;margin:28px auto 0;overflow:hidden; }
    .loader span { display:block;width:45%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:20px;animation:load 1.1s infinite; }
    @keyframes load { from{transform:translateX(-120%)} to{transform:translateX(350%)} }
    @keyframes float { 50%{transform:translateY(-5px)} }
    #app { width:100%;height:100%;position:relative;background:#fff; }
    #app iframe { display:block;width:100%;height:100%;border:0;background:#fff; }
    #install {
      position:fixed;right:18px;bottom:18px;z-index:9998;border:0;border-radius:14px;
      padding:12px 17px;background:#2563eb;color:white;font-weight:700;cursor:pointer;
      box-shadow:0 10px 30px rgba(37,99,235,.35);display:none;
    }
    #offline {
      position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:10000;
      background:#7f1d1d;color:#fff;padding:9px 14px;border-radius:999px;font-size:12px;
      display:none;
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-card">
      <img class="logo" src="./icons/icon-192.png" alt="KIR">
      <div class="brand">KIR</div>
      <div class="subtitle">Sistem Inventaris Barang</div>
      <div class="loader"><span></span></div>
    </div>
  </div>

  <div id="offline">Tidak ada koneksi internet</div>
  <button id="install" type="button">＋ Install KIR</button>

  <main id="app">
    <iframe
      id="kirApp"
      src="https://script.google.com/macros/s/AKfycbyUeQ2HqZ7qg4klCgnye4wEB2VRAxKXsSguKTDilzp9cAAG-ylowjBCo8k4zaPgo5hr/exec"
      title="KIR Maintenance"
      allow="camera; microphone; geolocation"
      allowfullscreen>
    </iframe>
  </main>

  <script>
    let deferredPrompt = null;

    window.addEventListener("load", () => {
      setTimeout(() => document.getElementById("splash").classList.add("hide"), 900);
    });

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById("install").style.display = "block";
    });

    document.getElementById("install").addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById("install").style.display = "none";
    });

    window.addEventListener("appinstalled", () => {
      document.getElementById("install").style.display = "none";
    });

    function updateOnlineStatus() {
      document.getElementById("offline").style.display = navigator.onLine ? "none" : "block";
    }
    window.addEventListener("online", updateOnlineStatus);
    window.addEventListener("offline", updateOnlineStatus);
    updateOnlineStatus();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
